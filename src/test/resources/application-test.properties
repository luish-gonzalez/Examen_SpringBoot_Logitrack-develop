spring.datasource.url=jdbc:h2:mem:logitrack_iq_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test-iq.sql
spring.sql.init.data-locations=optional:classpath:data-test.sql

jwt.secret=logitrack-iq-test-secret-key-exclusive-for-automated-tests-2026
jwt.expiration=3600000
